[package]
name = "ilc-flow-validator"
version = "0.1.1"
description = "Validatore del flusso Unicredit ILC con anteprima BOL / cust_data.xml / DAT"
authors = ["russus"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ilc_flow_validator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
